[[redirects]]
  from = "/staff"
  to = "https://161.33.208.191.sslip.io/staff"
  status = 200
  force = true

[[redirects]]
  from = "/user"
  to = "https://161.33.208.191.sslip.io/user"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "https://161.33.208.191.sslip.io/privacy"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "https://161.33.208.191.sslip.io/terms"
  status = 200
  force = true

[[redirects]]
  from = "/data-deletion"
  to = "https://161.33.208.191.sslip.io/data-deletion"
  status = 200
  force = true


[[redirects]]
  from = "/webhook/*"
  to = "https://161.33.208.191.sslip.io/webhook/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manual_images/*"
  to = "https://161.33.208.191.sslip.io/manual_images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://161.33.208.191.sslip.io/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://161.33.208.191.sslip.io/api/:splat"
  status = 200
  force = true

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
